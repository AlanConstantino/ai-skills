name: skill tests

on:
  push:
    paths: ["skills/*/scripts/**", "skills/*/tests/**", "skills/*/examples/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["skills/*/scripts/**", "skills/*/tests/**", "skills/*/examples/**", ".github/workflows/test.yml"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12", "3.x"]
        exclude:
          # Current Ubuntu runners no longer ship Python 3.9; macOS still tests it.
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run web-searx offline tests
        working-directory: skills/web-searx/tests
        run: python -m unittest -v
      - name: Run android-game-porting offline tests
        working-directory: skills/android-game-porting/tests
        run: python -m unittest -v
      - name: Run hill-climbing offline tests
        working-directory: skills/hill-climbing/tests
        run: python -m unittest -v
